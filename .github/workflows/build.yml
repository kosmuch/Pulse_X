name: Build Pulse_X

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.0'
      - name: Build mod
        run: |
          export JAVA_HOME="$JAVA_HOME_25_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          gradle -Dorg.gradle.java.installations.paths="$JAVA_HOME_21_X64" build
          export JAVA_HOME="$JAVA_HOME_25_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          gradle -Dorg.gradle.java.installations.paths="$JAVA_HOME_21_X64" build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Pulse_X
          path: build/libs/*.jar
